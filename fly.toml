# Fly.io (https://fly.io/docs/reference/configuration/). One Machine built
# from the Dockerfile, a volume for the session map, the health check on
# /api/health. `fly launch --copy-config --no-deploy` takes this file and
# asks for the app name and region.
# Status: verified with `fly launch`, `fly secrets import` and `fly deploy` on a throwaway app (docs/deploy/fly.md).

app = "openmuse"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  OPENMUSE_STATE_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Kept from the verified launch; nothing in the app needs the Machine
  # running between requests any more, so "stop" is an option.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "openmuse_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
