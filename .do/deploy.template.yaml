# DigitalOcean App Platform, the Deploy to DigitalOcean button's spec
# (https://docs.digitalocean.com/products/app-platform/how-to/add-deploy-do-button/):
# a regular app spec under the `spec:` key. One service built from the
# Dockerfile, the health check on /api/health. App Platform containers have
# no persistent disk, so the interim topic index lives in process memory
# (OPENMUSE_STATE_STORE=memory: topics are lost on every deploy or restart;
# the coordinator session is found again by its key) and the interim return
# path runs on the in-process timer. Secrets listed without a value are
# prompted for when the app is created; DigitalOcean does not generate them.
# Status: spec validated with `doctl apps spec validate --schema-only`;
# a deploy has not been exercised. The button requires a public repository.
spec:
  name: openmuse
  region: lon
  services:
    - name: web
      dockerfile_path: Dockerfile
      git:
        repo_clone_url: https://github.com/diggerhq/openmuse.git
        branch: main
      http_port: 3000
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
      health_check:
        http_path: /api/health
        initial_delay_seconds: 10
        period_seconds: 30
      envs:
        - key: OPENCOMPUTER_API_KEY
          type: SECRET
          scope: RUN_TIME
        - key: OPENCOMPUTER_PROJECT_ID
          scope: RUN_TIME
        - key: OPENMUSE_OWNER_SECRET
          type: SECRET
          scope: RUN_TIME
        - key: OPENMUSE_COOKIE_SECRET
          type: SECRET
          scope: RUN_TIME
        - key: OPENMUSE_AGENT_SECRET
          type: SECRET
          scope: RUN_TIME
        - key: OPENMUSE_STATE_STORE
          value: memory
          scope: RUN_TIME
        - key: OPENMUSE_RETURN_PATH
          value: timer
          scope: RUN_TIME
